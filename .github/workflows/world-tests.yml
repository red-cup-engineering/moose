name: MOOSE World tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install the MOOSE distribution and its declared suppliers
        run: |
          consumer="$RUNNER_TEMP/moose-consumer"
          mkdir "$consumer"
          archive=$(npm pack --ignore-scripts --silent --pack-destination "$consumer")
          protocol=$(node -p 'require("./package.json").peerDependencies["@red-cup-engineering/activitypub-engineering-services-section"]')
          cp .npmrc "$consumer/.npmrc"
          cd "$consumer"
          echo '{"private":true,"type":"module"}' > package.json
          npm install --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org \
            "./$archive" "@red-cup-engineering/activitypub-engineering-services-section@$protocol"
      - name: Exercise the installed World, public social views and recovery
        run: |
          cd "$RUNNER_TEMP/moose-consumer/node_modules/@red-cup-engineering/moose"
          npm test
          npm run test:consumer
          npm run demo:world
