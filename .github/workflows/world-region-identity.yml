# Qualify the original MOOSE World carrier and its shipped receiver. This
# does not perform npm publication or claim host deployment.
name: MOOSE World region identity receiving
on:
  pull_request:
    paths:
      - '.github/workflows/world-region-identity.yml'
      - 'src/world.mjs'
      - 'test/world-region-identity.test.mjs'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/world-region-identity.yml'
      - 'src/world.mjs'
      - 'test/world-region-identity.test.mjs'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moose-world-region-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-receiving:
    runs-on: [self-hosted, bare-cedar-fog]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check exact source and test syntax without dependencies
        run: |
          node --check src/world.mjs
          node --check test/world-region-identity.test.mjs
      - name: Install the exact declared house package family
        run: npm install --ignore-scripts --no-audit --no-fund --registry=https://registry.561.group/
      - name: Execute the native World region regression
        run: node --test test/world-region-identity.test.mjs
      - name: Exercise the original complete MOOSE source suite
        run: npm test
      - name: Verify native package carries this regression
        run: |
          npm pack --dry-run --json > /tmp/moose-world-region-package.json
          node -e 'const assert=require("node:assert/strict");const [pkg]=require("/tmp/moose-world-region-package.json");assert(pkg.files.some(f=>f.path==="test/world-region-identity.test.mjs"))'
