name: MOOSE Fetch-only dependency boundary
on:
  push:
    branches: [main]
    paths:
      - src/**
      - test/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/fetch-dependency.yml
  pull_request:
    paths:
      - src/**
      - test/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/fetch-dependency.yml
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify portable source and source-owned projections without installed dependencies
        run: |
          node --check src/application.mjs
          node --check src/fetch.mjs
          node --check src/section-site.mjs
          node --check src/resource-readout.mjs
          node --test test/fetch-dependency.test.mjs test/section-site.test.mjs test/resource-readout.test.mjs test/source-page-routes.test.mjs test/pack-contract.test.mjs test/geometry-motion.test.mjs
  world-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Receive the original World gateway with its exact suppliers
        shell: bash
        run: |
          set -euo pipefail
          gateway_dependencies="$RUNNER_TEMP/moose-world-gateway"
          mkdir -p "$gateway_dependencies"
          npm install --prefix "$gateway_dependencies" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000 --registry=https://registry.561.group @red-cup-engineering/computer-content-address-engineering-services-section@0.2.0 @red-cup-engineering/json-engineering-services-section@0.4.0
          ln -s "$gateway_dependencies/node_modules" node_modules
          node --test --test-reporter=tap test/world-gateway.test.mjs
  native-world:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the locked runtime providers from the Group registry
        run: npm exec --yes --package=pnpm@11.28.5 -- pnpm install --prod --frozen-lockfile --ignore-scripts --fetch-retries=1 --fetch-timeout=30000 --registry=https://registry.561.group
      - run: npm run test:world
      - run: node --test test/engine*.test.mjs
      - run: npm run demo:world

  installed-host:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the locked host and test providers from the Group registry
        run: npm exec --yes --package=pnpm@11.28.5 -- pnpm install --frozen-lockfile --ignore-scripts --fetch-retries=1 --fetch-timeout=30000 --registry=https://registry.561.group
      - name: Report selected Fedify/vocabulary module graph
        run: npm ls @fedify/fedify @fedify/vocab @fedify/vocab-runtime --all || true
      - name: Run all repository tests on the installed provider graph
        run: npm test
